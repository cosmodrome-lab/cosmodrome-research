name: Sync Medium publications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync Medium publications
        run: python scripts/sync_medium.py

      - name: Commit changes
        run: |
          if git diff --quiet -- PUBLICATIONS.md; then
            echo "No new publications"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PUBLICATIONS.md
          git commit -m "Sync Medium publications"
          git push
